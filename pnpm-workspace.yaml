packages:
  - apps/*
  - packages/*

# pnpm 12 reads its settings here, not from .npmrc.
saveExact: true
engineStrict: true

# Supply-chain rule (SECURITY T15): only versions published at least 14 days ago (value in minutes).
minimumReleaseAge: 20160

# Install scripts are denied unless listed here (SECURITY T15). esbuild ships its binary as an optional
# dependency, so its postinstall check is not needed.
allowBuilds:
  esbuild: false

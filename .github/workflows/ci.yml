name: CI

on:
  pull_request:
  push:
    # Every branch, so a task branch is green before it is merged (no PR needed).
    branches: ['**']

# Least privilege (SECURITY T17): read-only token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 12.11.2

jobs:
  checks:
    name: typecheck · lint · format · unit · sim
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions pinned by commit SHA (SECURITY T17); the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:sim
      - run: pnpm assets:check

  build:
    name: build · bundle size
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:size

  e2e:
    name: e2e smoke (1440×900, 390×844)
    runs-on: ubuntu-24.04
    # apt mirrors behind `playwright install --with-deps` have taken up to 14 min.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  container:
    name: container · headers · embed e2e
    runs-on: ubuntu-24.04
    # apt mirrors behind `playwright install --with-deps` have taken up to 14 min.
    timeout-minutes: 25
    env:
      # Same digest as deploy/Dockerfile, pulled from Google's Docker Hub mirror to avoid Hub rate limits.
      CADDY_IMAGE: mirror.gcr.io/library/caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: docker build -f deploy/Dockerfile --build-arg CADDY_IMAGE="$CADDY_IMAGE" -t kometa-web .
      # Game and kill-switch containers + mock host; the smoke suite fails on any CSP/Trusted Types violation.
      - run: tools/embed-e2e.sh kometa-web
        env:
          CI: 'true'

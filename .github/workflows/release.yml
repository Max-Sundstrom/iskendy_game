name: Release archive

# Every push to main builds a versioned archive as a workflow artifact; a vX.Y.Z tag also publishes it as a
# GitHub Release. The server pulls a pinned archive and checks its sha256 (ADR-021, INFRASTRUCTURE §0).
on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  PNPM_VERSION: 12.11.2

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # only used by the tag step that creates the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:size
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-main.${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: tools/pack-release.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kometa-web-${{ steps.version.outputs.version }}
          path: release/
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" release/* --repo "$GITHUB_REPOSITORY" --title "KOMETA web ${VERSION}" --notes "See CHANGELOG.md" --verify-tag
